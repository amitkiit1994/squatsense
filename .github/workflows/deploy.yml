name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-backend.txt
      - name: Install dependencies
        run: pip install -r requirements-backend.txt
      - name: Import smoke test (boot-crash gate)
        run: python -c "from backend.main import app"
        env:
          JWT_SECRET_KEY: build-smoke-test-dummy-key-32chars-x
      - name: Run tests
        run: pytest backend/tests/ -v --tb=short
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-minimum-32chars

  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-backend.txt
      - name: Install dependencies
        run: pip install -r requirements-backend.txt ruff
      - name: Ruff check
        # Rule selection lives in ruff.toml (single source of truth).
        # CLI --select/--ignore flags would override the config's baseline ignores.
        run: ruff check backend/

  check-squatsense:
    name: SquatSense Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: squatsense-web/package-lock.json
      - name: Install dependencies
        working-directory: squatsense-web
        run: npm ci
      - name: Type check
        working-directory: squatsense-web
        run: npx tsc --noEmit
      - name: Build
        working-directory: squatsense-web
        run: npm run build

  check-freeform:
    name: FreeForm Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit SquatSense
        working-directory: squatsense-web
        run: npm audit --audit-level=high || true
      - name: Audit FreeForm
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Check for secrets in code
        run: |
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" backend/ squatsense-web/src/ frontend/src/ 2>/dev/null; then
            echo "::error::Possible API key found in source code"
            exit 1
          fi

  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test-backend, lint-backend, check-squatsense, check-freeform]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Review PR changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Review the changes in this PR. Check for:
          1. Security issues (missing auth, SQL injection, hardcoded secrets)
          2. Convention violations per CLAUDE.md (f-strings in loggers, legacy .query(), missing type hints)
          3. Cross-product contamination (SquatSense referencing FreeForm or vice versa)
          4. Async correctness (blocking calls in async functions)
          Report ONLY new issues in changed files. Be concise." \
          --output-format json > review.json || true
      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const review = fs.readFileSync('review.json', 'utf8');
              if (review.trim()) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## Claude Code Review\n\n${review.substring(0, 60000)}`
                });
              }
            } catch (e) {
              console.log('No review output to post');
            }

  deploy-backend:
    name: Deploy Backend
    needs: [test-backend, lint-backend, check-squatsense, check-freeform]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN not set — skipping deploy"
            exit 0
          fi
          npx @railway/cli up --service backend

  deploy-squatsense:
    name: Deploy SquatSense
    needs: [test-backend, lint-backend, check-squatsense, check-freeform]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping deploy"
            exit 0
          fi
          npx vercel deploy --prod --token=$VERCEL_TOKEN squatsense-web/

  deploy-freeform:
    name: Deploy FreeForm
    needs: [test-backend, lint-backend, check-squatsense, check-freeform]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping deploy"
            exit 0
          fi
          npx vercel deploy --prod --token=$VERCEL_TOKEN frontend/
